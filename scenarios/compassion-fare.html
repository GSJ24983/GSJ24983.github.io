<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swanubhava™ scenarios - The compassion fare</title>
<style>
:root{
  --indigo:#201A3E; --deep:#15112B; --surface:#2B2456; --surf2:#352C68;
  --coral:#FF6B4A; --coral2:#FF835F; --onCoral:#25100A; --teal:#16B5A4; --onTeal:#04211E; --blue:#0070C0;
  --lav:#B9AEE8; --ink:#F3F0FF; --mute:#A79EC9; --line:#463C7F; --gold:#F2C14E;
  --body:#DCD6F5; --tint:rgba(43,36,86,.55); --shadow:none;
  --serif:'Fraunces','Iowan Old Style',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans','Segoe UI',system-ui,-apple-system,Calibri,sans-serif;
}

html[data-theme='light']{
  --indigo:#EAF0F8; --deep:#FFFFFF; --surface:#F4F8FC; --surf2:#E7EFF8;
  --coral:#0B5FBF; --coral2:#0A54A8; --onCoral:#FFFFFF; --teal:#0E7C6B; --onTeal:#FFFFFF; --blue:#0B5FBF;
  --lav:#2C5C92; --ink:#10233B; --mute:#5C7288; --line:#CFDDEC; --gold:#9A6B0F;
  --body:#22364F; --tint:#F4F8FC; --shadow:0 1px 2px rgba(16,35,59,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--deep);color:var(--ink);font-family:var(--sans);line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 64px}
a{color:var(--lav)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* masthead */
.mast{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.strings{width:34px;height:34px;flex:none}
.mast h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:.1px}
.mast .sub{color:var(--mute);font-size:13px;margin-left:auto}
.themeBtn{background:var(--surface);border:1px solid var(--line);color:var(--mute);border-radius:7px;
  width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0}
.themeBtn:hover{color:var(--ink);border-color:var(--lav)}

/* hub */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:24px}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;background:var(--indigo)}
.thumb svg{display:block;width:100%;height:100%}
.xbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.tagrow{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.tag.hot{background:var(--teal);border-color:var(--teal);color:var(--onTeal);font-weight:600}
.xcard h2{font-family:var(--serif);font-size:20px;margin:2px 0 0;font-weight:600}
.xcard p{margin:0;color:var(--mute);font-size:14px;flex:1}
.play{margin-top:6px;align-self:flex-start;background:var(--coral);color:var(--onCoral);border:0;border-radius:9px;
  padding:9px 15px;font-weight:650;font-size:14px;cursor:pointer}
.play:hover{background:var(--coral2)}

/* player shell */
.player{display:grid;grid-template-columns:236px 1fr;gap:26px;margin-top:24px;align-items:start}
.rail{position:sticky;top:20px}
.railTitle{font-family:var(--serif);font-size:17px;margin:0 0 2px}
.railKicker{color:var(--mute);font-size:12.5px;margin:0 0 16px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{position:relative;padding:0 0 16px 24px;color:var(--mute);font-size:13.5px}
ol.steps li:before{content:'';position:absolute;left:4px;top:5px;width:9px;height:9px;transform:rotate(45deg);
  border:1.5px solid var(--line);background:var(--deep)}
ol.steps li:after{content:'';position:absolute;left:8px;top:16px;bottom:-1px;width:1.5px;background:var(--line)}
ol.steps li:last-child:after{display:none}
ol.steps li.done{color:var(--lav)}
ol.steps li.done:before{background:var(--teal);border-color:var(--teal)}
ol.steps li.now{color:var(--ink);font-weight:600}
ol.steps li.now:before{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,107,74,.18)}
.chip{display:inline-block;margin-left:7px;font-size:11px;font-weight:500;color:var(--deep);
  background:var(--lav);border-radius:99px;padding:1px 7px;vertical-align:1px}
.backlink{margin-top:20px;background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;padding:0}
.backlink:hover{color:var(--ink)}

/* stage */
.scene{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--indigo);
  height:clamp(104px,19vh,168px)}
.scene svg{display:block;width:100%;height:100%}
.panel{margin-top:20px}
.eyebrow{color:var(--coral);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.eyebrow .dot{width:6px;height:6px;background:var(--coral);transform:rotate(45deg)}
.stitle{font-family:var(--serif);font-size:29px;line-height:1.22;margin:0 0 12px;font-weight:600}
.stext{font-size:17.5px;color:var(--body);margin:0 0 18px;max-width:68ch;line-height:1.6}
.stext.narr{font-family:var(--serif);font-size:19.5px;line-height:1.62}
.media{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}
.media a{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.media a:hover{border-color:var(--lav)}
.media .mk{font-size:11px;color:var(--deep);background:var(--lav);border-radius:4px;padding:1px 6px;font-weight:650}
.prompt{font-family:var(--serif);font-size:22px;line-height:1.32;margin:0 0 14px;color:var(--ink)}
.phead{display:flex;align-items:flex-start;gap:12px}
.phead .stitle,.phead .prompt{flex:1;margin-bottom:0}
.aff{display:flex;gap:7px;flex:none;padding-top:2px}
.aff button{width:31px;height:31px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--lav);font-family:var(--serif);font-size:15px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.aff button:hover{border-color:var(--coral);color:var(--ink)}
.aff button.on{background:var(--coral);border-color:var(--coral);color:var(--onCoral)}
.aff button .badge{position:absolute;font-size:0}
.ctx{max-width:760px;border:1px solid var(--line);border-left:3px solid var(--lav);border-radius:0 11px 11px 0;
  background:var(--tint);padding:14px 17px;margin:0 0 16px}
.ctx h4{font-family:var(--serif);font-size:14.5px;margin:0 0 8px;color:var(--lav);font-weight:600}
.ctx .bit{margin:0 0 11px;font-size:15.5px;line-height:1.55;color:var(--body)}
.ctx .bit:last-child{margin-bottom:0}
.ctx .bit b{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:2px}
.rubwrap{max-width:760px;margin-top:16px}
.rubwrap .rlab{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.rubric.folded{display:none}
.linkrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
.linkbtn{background:none;border:0;color:var(--mute);font-size:14.5px;cursor:pointer;padding:0;
  text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.aibox{max-width:760px;margin-top:18px;border:1px solid var(--line);border-radius:12px;
  padding:14px 17px;background:var(--tint)}
.aibox .alab{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mute);
  font-weight:600;margin-bottom:10px}
.scorepill{background:var(--coral);color:var(--onCoral);border-radius:99px;padding:2px 10px;
  font-size:12.5px;font-weight:700}
.scorepill.full{background:var(--teal);color:var(--onTeal)}
.aifb{font-size:15.5px;line-height:1.6;color:var(--body)}
.aifb b{color:var(--ink)}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--coral);
  border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crit{transition:opacity .25s ease}
.vpq{max-width:760px;border-left:3px solid var(--coral);background:var(--tint);
  border-radius:0 11px 11px 0;padding:13px 17px;margin:0 0 16px;font-size:17.5px;line-height:1.5;
  font-family:var(--serif);color:var(--ink)}
.vpq b{display:block;font-family:var(--sans);font-size:12.5px;color:var(--coral);
  font-weight:650;margin-bottom:5px;letter-spacing:.2px}

.choices{display:flex;flex-direction:column;gap:10px;max-width:760px}
.choice{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:13px 15px;color:var(--ink);cursor:pointer;width:100%}
.choice:hover:not(:disabled){border-color:var(--coral);background:var(--surf2)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.choice .k{flex:none;width:25px;height:25px;border-radius:6px;background:var(--surf2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--lav)}
.choice .lb{font-size:16.5px;font-weight:560;line-height:1.4}
.choice .sb{font-size:14px;color:var(--mute);margin-top:3px}
.opt{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px 15px;font-size:16px;cursor:pointer;max-width:760px;margin-bottom:9px}
.opt input{margin-top:4px;accent-color:var(--coral)}
.opt.sel{border-color:var(--coral)}

textarea{width:100%;max-width:760px;min-height:126px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-family:inherit;font-size:16.5px;line-height:1.55;resize:vertical}
textarea:focus{border-color:var(--lav);outline:none}
.rubric{max-width:760px;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.crit{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--mute);
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--tint)}
.crit .mk{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px}
.crit.met{color:var(--ink);border-color:var(--teal)}
.crit.met .mk{background:var(--teal);border-color:var(--teal)}
.cont,.primary{margin-top:16px;background:var(--coral);color:var(--onCoral);border:0;border-radius:9px;
  padding:11px 19px;font-weight:650;font-size:15px;cursor:pointer}
.cont:hover,.primary:hover{background:var(--coral2)}
.ghost{margin-top:16px;margin-left:9px;background:none;border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:11px 17px;font-size:15px;cursor:pointer}
.ghost:hover{border-color:var(--lav)}

.lesson{border-left:3px solid var(--coral);background:rgba(255,107,74,.09);border-radius:0 9px 9px 0;
  padding:12px 16px;margin:0 0 15px;font-size:15.5px;line-height:1.55;max-width:760px}
.lesson.good{border-left-color:var(--teal);background:rgba(22,181,164,.10)}
.lesson b{display:block;margin-bottom:3px;font-size:12.5px;color:var(--lav);font-weight:650}

/* ending */
.moral{font-family:var(--serif);font-size:23px;font-style:italic;color:var(--gold);margin:0 0 14px;max-width:60ch}
/* authored line breaks (\n in the JSON) show as line breaks; long lines still wrap */
.stext,.lesson,.prompt,.vpq,.moral,.aifb,.ctx .bit,.revealed li span:last-child{white-space:pre-line}
/* visual blocks: post, people, image - drawn from the theme tokens, no files needed */
figure.blk{max-width:680px;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px}
.b-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--deep);flex:none}
.b-h{display:flex;gap:10px;align-items:center;margin-bottom:9px;font-size:15px}
.b-hd{color:var(--mute);font-size:13px;margin-left:6px}
.b-t{margin:0 0 10px;font-size:16px;line-height:1.55;color:var(--ink);white-space:pre-line}
.b-shot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--tint);margin:0 0 10px}
.b-sl{font-size:11.5px;font-weight:650;color:var(--lav);margin-bottom:4px;letter-spacing:.03em;text-transform:uppercase}
.b-shot p{margin:0;font-size:15px;line-height:1.5;color:var(--body);white-space:pre-line}
.b-lk{display:inline-block;margin-top:6px;font-size:13px;color:var(--lav);text-decoration:underline;text-underline-offset:3px}
.b-st{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px}
.b-cap{font-size:12.5px;font-weight:650;color:var(--mute);margin:0 0 10px}
.b-pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.b-pc{display:flex;gap:10px;align-items:flex-start;min-width:0}
.b-pc b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}
.b-rl{display:block;font-size:13px;color:var(--lav);margin-bottom:4px}
.b-pc p{margin:0;font-size:14px;line-height:1.5;color:var(--body)}
figure.blk.img{padding:8px}
figure.blk.img img{display:block;max-width:100%;border-radius:8px}
figure.blk.img .b-cap{font-weight:400;margin:8px 6px 2px}
.b-ph{border:1.5px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5}
/* multi-select breakdown: every option, what the learner did with it, and its why */
.mb{list-style:none;margin:12px 0 0;padding:0;max-width:760px;display:flex;flex-direction:column;gap:8px}
.mb li{border:1px solid var(--line);border-left-width:3px;border-radius:0 10px 10px 0;padding:10px 14px;background:var(--surface)}
.mb .mbh{display:flex;flex-direction:column;align-items:flex-start;gap:5px;font-size:15.5px;color:var(--ink)}
.mb .mbt{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.02em;border-radius:99px;padding:1px 9px;border:1px solid var(--line);color:var(--mute)}
.mb .why{margin:5px 0 0;font-size:14.5px;line-height:1.5;color:var(--body)}
.mb li.hit{border-left-color:var(--teal)}.mb li.hit .mbt{background:var(--teal);border-color:var(--teal);color:var(--onTeal)}
.mb li.miss{border-left-color:var(--gold)}.mb li.miss .mbt{color:var(--gold);border-color:var(--gold)}
.mb li.wrong{border-left-color:var(--coral)}.mb li.wrong .mbt{color:var(--coral);border-color:var(--coral)}
.mb li.skip{opacity:.8}
.b-ph b{display:block;color:var(--lav);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
/* red line: facilitator talking point inside the folded rubric, never graded */
.redline{border:1px dashed var(--coral);border-radius:9px;padding:10px 12px;background:rgba(255,107,74,.07);font-size:14.5px;line-height:1.5;color:var(--body)}
.redline b{display:block;color:var(--coral);font-size:12.5px;font-weight:650;margin-bottom:4px}
.redline .rlp{display:inline-block;margin:7px 6px 0 0;padding:2px 9px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;color:var(--mute)}
.revealed{list-style:none;padding:0;margin:0 0 16px;max-width:760px}
.revealed li{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}
.revealed li span:first-child{flex:none;width:150px;color:var(--lav);font-weight:600}
.summary{max-width:760px;margin-top:24px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);box-shadow:var(--shadow)}
.summary h3{font-family:var(--serif);font-size:17px;margin:0 0 4px;font-weight:600}
.summary p{margin:0 0 11px;font-size:13.5px;color:var(--mute)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--deep);
  border:1px solid var(--line);border-radius:8px;padding:11px 13px;word-break:break-all;color:var(--lav)}
.copy{margin-top:11px;background:var(--teal);color:var(--onTeal);border:0;border-radius:8px;padding:8px 14px;
  font-weight:650;font-size:13.5px;cursor:pointer}
.hidden{display:none!important}
.fade{animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:760px){
  .player{grid-template-columns:1fr;gap:18px}
  .rail{position:static;order:2;border-top:1px solid var(--line);padding-top:16px}
  .stage{order:1}
  .stitle{font-size:24px}
  .prompt{font-size:19.5px}
  .scene{height:96px}
  .revealed li{flex-direction:column;gap:3px}
  .revealed li span:first-child{width:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <svg class="strings" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M6 8h28" stroke="#FF6B4A" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M12 8v13M20 8v19M28 8v13" stroke="#463C7F" stroke-width="1.3"/>
      <path d="M12 21l0 0" stroke="#16B5A4"/>
      <rect x="8.5" y="21" width="7" height="7" rx="1.4" transform="rotate(45 12 24.5)" fill="#16B5A4"/>
      <rect x="16.5" y="27" width="7" height="7" rx="1.4" transform="rotate(45 20 30.5)" fill="#B9AEE8"/>
      <rect x="24.5" y="21" width="7" height="7" rx="1.4" transform="rotate(45 28 24.5)" fill="#F2C14E"/>
    </svg>
    <h1 id="deckTitle">The Puppeteer</h1>
    <span class="sub">Learn by deciding</span>
    <button class="themeBtn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9">
        <circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
      </svg></button>
  </header>

  <section id="hub">
    <div class="cards" id="cards"></div>
  </section>

  <section id="player" class="player hidden">
    <aside class="rail">
      <h2 class="railTitle" id="railTitle"></h2>
      <p class="railKicker" id="railKicker"></p>
      <ol class="steps" id="steps"></ol>
      <button class="backlink" id="backBtn">&larr; All scenarios</button>
    </aside>
    <main class="stage" id="stage"></main>
  </section>
</div>

<script>
/* =====================================================================
   THE PUPPETEER - player engine. Frozen. Content lives in DATA below.
   ===================================================================== */
var DATA = {
 "deckTitle": "Swanubhava scenarios",
 "scenarios": [
  {
   "anchor": "Acts with integrity under pressure",
   "behaviour": "speaks up for end users when a request works against them",
   "blurb": "Your airline's AI assistant told a grieving customer she could claim a discount after booking. She could not. Legal has a cheap way out. One thing to notice, three decisions and one note to write, about 25 minutes.",
   "endings": {
    "good": {
     "moral": "If it speaks on your site, it speaks for you.",
     "revealed": [
      [
       "What you noticed",
       "A promise in SkyBridge's name, from the wrong source, made to more than one customer."
      ],
      [
       "What you did",
       "You sized it before you solved it, honoured it for everyone, and let Legal own the words, not the decision."
      ],
      [
       "The red line",
       "Any note that says the customer should have read the policy page fails, however good the rest is."
      ],
      [
       "The real case",
       "In 2024 a Canadian tribunal ruled on almost exactly this situation. Air Canada's website chatbot told a grieving passenger, Jake Moffatt, that he could book at the normal fare and claim the bereavement fare afterwards. The policy page the chatbot linked to said the opposite. The airline offered him a voucher, argued he should have read the policy page, and even argued the chatbot was responsible for its own actions. The tribunal said the chatbot is simply part of the airline's website, that the airline is responsible for everything on its website, and ordered it to pay him the fare difference plus interest and fees. (Moffatt v. Air Canada, 2024.)"
      ],
      [
       "Take this with you",
       "One screenshot is rarely one customer. And for AI: not 'how accurate?' but 'wrong on what, and who pays?'"
      ]
     ],
     "scene": "launch",
     "step": 7,
     "title": "The answer was always yours",
     "verdict": "Wednesday's review takes twelve minutes. Arjun approves refunds for all 41, and Farah's wording goes out the same afternoon. By Friday, 33 of the 41 have replied, most with some version of 'thank you for telling me first'. Meera updates her post: SkyBridge got it wrong, and then put it right. A travel journalist who had seen Meera's post runs a short item the next week about an airline that found its own mistake. Fare answers come back two weeks later, quoting the policy page, with a weekly look at everything the assistant was unsure about.\n\nNow the question for the debrief: when your AI makes a promise to a customer, whose promise is it?"

    "partial": {

function curStep(){

  var s=byId(S.sc),cur=curStep();stepsEl.innerHTML='';

    var cls=i<cur?'done':(i===cur?'now':'');
    var chip=S.chips[i]?'<span class="chip">'+esc(S.chips[i])+'</span>':'';
    stepsEl.appendChild(el('<li class="'+cls+'">'+esc(label)+chip+'</li>'));

function goTo(nodeId){
  var s=byId(S.sc),n=(s.nodes||{})[nodeId];
  if(!n){ var e=(s.endings||{})[nodeId]; if(e){return showEnding(nodeId,e);} 
    stageEl.innerHTML='<p class="stext">Missing node: '+esc(nodeId)+'</p>';return;}
  S.node=nodeId;S.ending=null;renderSteps();
  if(n.type==='narrative')return renderNarrative(n);
  if(n.type==='choice')return renderChoice(n,nodeId);
  if(n.type==='multi')return renderMulti(n,nodeId);

function blocksOf(n,at){return ((n&&n.blocks)||[]).filter(function(b){return (b.at||'top')===at;});}
function initials(s){return String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w.charAt(0).toUpperCase();}).join('');}

      (b.after?'<p class="b-t">'+esc(b.after)+'</p>':'')+(b.stats?'<div class="b-st">'+esc(b.stats)+'</div>':'')+'</figure>';}

      (b.caption?'<p class="b-cap">'+esc(b.caption)+'</p>':'')+'</figure>';}

function blocksHTML(n,at){return blocksOf(n,at).map(blockHTML).join('');}
function blockText(b){
  if(b.type==='post')return [b.author?b.author+(b.meta?' ('+b.meta+')':'')+':':'',b.text,b.reply&&b.reply.text?(b.reply.from||'Reply')+': '+b.reply.text:'',b.after,b.stats].filter(Boolean).join('\n');
  if(b.type==='people')return (b.people||[]).map(function(p){return p.name+(p.role?', '+p.role:'')+(p.lines?'. '+p.lines:'');}).join('\n');

/* the i panel keeps what blocks said, so a learner can reread a post while writing */
function withBlocks(n,text){

}

/* narrative */
function remember(label,text){
  if(!text)return;
  for(var i=0;i<S.story.length;i++)if(S.story[i].text===text)return;
  S.story.push({label:label||'Earlier',text:text});
}
function renderNarrative(n){
  remember(n.title||n.eyebrow||'Earlier',withBlocks(n,n.text));
  stageOut(n,blocksHTML(n,'top')+(n.text?'<p class="stext narr">'+esc(n.text)+'</p>':'')+blocksHTML(n,'bottom')+mediaHTML(n.media)+
    '<button class="cont" id="go">Continue &rarr;</button>');
  document.getElementById('go').addEventListener('click',function(){goTo(n.to);});
}

/* choice */
function renderChoice(n,nodeId){
  var dis=S.disabled[nodeId]||[];
  var body='<div class="phead"><p class="prompt">'+esc(n.prompt)+'</p>'+affBar(n,0)+'</div>'+
    ctxHTML(n)+mediaHTML(n.media)+'<div class="choices">'+
    n.choices.map(function(c,i){
      return '<button class="choice" data-i="'+i+'"'+(dis.indexOf(i)>-1?' disabled':'')+'>'+
        '<span class="k">'+esc(c.k||String.fromCharCode(65+i))+'</span><span><span class="lb">'+
        esc(c.label)+'</span>'+(c.sub?'<span class="sb">'+esc(c.sub)+'</span>':'')+'</span></button>';
    }).join('')+'</div>';
  stageOut(n,body);wireAff(n);
  Array.prototype.forEach.call(stageEl.querySelectorAll('.choice'),function(b){
    b.addEventListener('click',function(){choose(n,nodeId,+b.getAttribute('data-i'));});
  });
}
function choose(n,nodeId,i){
  var c=n.choices[i];
  S.log.push({node:nodeId,kind:'choice',pick:c.k||String.fromCharCode(65+i),
    label:c.label,tag:c.tag||c.label,gated:!!(n.gate&&c.correct===false)});
  if(n.gate&&c.correct===false){
    S.disabled[nodeId]=(S.disabled[nodeId]||[]).concat([i]);
    renderChoice(n,nodeId);
    var p=stageEl.querySelector('.choices');
    p.parentNode.insertBefore(el('<div class="lesson"><b>Not yet</b>'+esc(c.lesson||c.note||'')+'</div>'),p);
    return;
  }
  if(typeof n.step==='number'&&c.chip)S.chips[n.step]=c.chip;
  var cq=c.consequence;
  if(!cq)return goTo(c.to||n.to);
  remember(cq.title||'What happened',withBlocks(cq,cq.text));
  stageOut({scene:cq.scene||n.scene,title:cq.title,eyebrow:cq.eyebrow},
    blocksHTML(cq,'top')+'<p class="stext">'+esc(cq.text)+'</p>'+blocksHTML(cq,'bottom')+
    (cq.lesson?'<div class="lesson'+(cq.good?' good':'')+'"><b>'+(cq.good?'Why this worked':'What this cost you')+'</b>'+esc(cq.lesson)+'</div>':'')+
    '<button class="cont" id="go">Continue &rarr;</button>');
  document.getElementById('go').addEventListener('click',function(){goTo(c.to||n.to);});
}

/* multi-select, rules-based */
function renderMulti(n,nodeId){
  var body='<div class="phead"><p class="prompt">'+esc(n.prompt)+'</p>'+affBar(n,0)+'</div>'+
    ctxHTML(n)+mediaHTML(n.media)+
    '<div id="opts">'+n.options.map(function(o,i){
      return '<label class="opt"><input type="checkbox" value="'+i+'"><span>'+esc(o.label)+
        (o.sub?'<span class="sb">'+esc(o.sub)+'</span>':'')+'</span></label>';}).join('')+'</div>'+
    '<button class="primary" id="sub">Submit</button><div id="fb"></div>';
  stageOut(n,body);wireAff(n);
  Array.prototype.forEach.call(stageEl.querySelectorAll('.opt input'),function(cb){
    cb.addEventListener('change',function(){cb.parentNode.classList.toggle('sel',cb.checked);});
  });
  document.getElementById('sub').addEventListener('click',function(){
    var picked=[];Array.prototype.forEach.call(stageEl.querySelectorAll('.opt input'),function(cb){
      if(cb.checked)picked.push(+cb.value);});
    var need=n.correct||[],hit=0,extra=0;
    picked.forEach(function(i){need.indexOf(i)>-1?hit++:extra++;});
    var ok=hit===need.length&&extra===0;
    var miss=need.filter(function(i){return picked.indexOf(i)<0;})
      .map(function(i){return n.options[i].label;});
    S.log.push({node:nodeId,kind:'multi',pick:picked.join('+'),score:hit+'/'+need.length,
      missed:miss.slice(),extras:extra});
    var fb=document.getElementById('fb');
    /* name what was missed and what was picked that does not belong; an option's optional 'why' explains it */
    var withWhy=function(i){var o=n.options[i];return o.label+(o.why?' - '+o.why:'');};
    var missW=need.filter(function(i){return picked.indexOf(i)<0;}).map(withWhy);
    var extraW=picked.filter(function(i){return need.indexOf(i)<0;}).map(withWhy);
    var head=ok?'Complete':missW.length?'Partial - '+hit+' of '+need.length:
      'All '+need.length+' that matter - plus '+extra+' that do'+(extra===1?'es':'')+' not';
    var body=ok?(n.successNote||'Every one that mattered, and nothing that did not.'):
      [missW.length?(n.missNote||'Still missing: ')+missW.join('; '):'',
       extraW.length?(n.extraNote||(extraW.length===1?'This one does not belong: ':'These do not belong: '))+extraW.join('; '):''
      ].filter(Boolean).join('\n\n');
    /* when the author wrote a 'why' on any option, show every option with what the learner did and why */
    var hasWhy=n.options.some(function(o){return !!o.why;});
    var MB={hit:'You picked it - it matters',miss:'You missed this one - it matters',wrong:'You picked it - it does not belong',skip:'Rightly left out'};
    var breakdown=hasWhy?'<ul class="mb">'+n.options.map(function(o,i){
        var isNeed=need.indexOf(i)>-1,isPick=picked.indexOf(i)>-1,st=isNeed?(isPick?'hit':'miss'):(isPick?'wrong':'skip');
        return '<li class="'+st+'"><div class="mbh"><span class="mbt">'+MB[st]+'</span><span>'+esc(o.label)+'</span></div>'+
          (o.why?'<p class="why">'+esc(o.why)+'</p>':'')+'</li>';}).join('')+'</ul>':'';
    if(hasWhy&&!ok)body=missW.length&&extraW.length?'You missed some that matter and picked some that do not. Each one is below, with why.':
      missW.length?'You missed '+(missW.length===1?'one that matters':missW.length+' that matter')+'. Each one is below, with why.':
      'You picked '+(extraW.length===1?'one that does not belong':extraW.length+' that do not belong')+'. Each one is below, with why.';
    fb.innerHTML='<div class="lesson'+(ok?' good':'')+'" style="margin-top:16px"><b>'+esc(head)+'</b>'+esc(body)+'</div>'+breakdown+
      '<button class="cont" id="go">Continue &rarr;</button>';
    document.getElementById('sub').disabled=true;
    Array.prototype.forEach.call(stageEl.querySelectorAll('.opt input'),function(cb){cb.disabled=true;});
    document.getElementById('go').addEventListener('click',function(){goTo(n.to);});
  });
}

/* free text, rubric-graded */
function evaluateAnswer(text,criteria){
  var t=(' '+String(text).toLowerCase()+' ').replace(/[^a-z0-9\s]/g,' ');
  var met=criteria.map(function(c){
    return (c.keywords||[]).some(function(k){return t.indexOf(' '+k.toLowerCase()+' ')>-1||t.indexOf(k.toLowerCase())>-1;});
  });
  return {met:met,score:met.filter(Boolean).length};
}
function coachList(n,met){
  return n.criteria.filter(function(c,i){return !met[i];})
    .map(function(c){return c.coach||c.hint||c.label;});
}
function joinCoach(a){
  if(a.length===1)return a[0];
  return a.slice(0,-1).join('; ')+'; and '+a[a.length-1];
}
/* redFlags: a talking point for the facilitator. Shown inside the folded rubric (press e), never graded. */
function redFlagsOf(n){
  var r=n.redFlags;if(!r)return null;
  if(Array.isArray(r))r={phrases:r};
  return {rule:r.rule||'',phrases:r.phrases||[]};
}
function redLineHTML(n){
  var r=redFlagsOf(n);if(!r||(!r.rule&&!r.phrases.length))return '';
  return '<div class="redline"><b>Red line - for discussion, not graded</b>'+esc(r.rule)+
    (r.phrases.length?'<div>'+r.phrases.map(function(p){return '<span class="rlp">'+esc(p)+'</span>';}).join('')+'</div>':'')+'</div>';
}
function renderEvaluate(n,nodeId){
  var expand=n.showRubric===true;
  var tries=S.tries[nodeId]||0;
  var ask=n.speaker
    ? '<div class="vpq"><b>'+esc(n.speaker)+'</b>&ldquo;'+esc(n.question||n.prompt)+'&rdquo;</div>'
    : '<p class="prompt">'+esc(n.question||n.prompt)+'</p>';
  var head=n.speaker
    ? '<div class="phead"><span style="flex:1"></span>'+affBar(n,n.criteria.length)+'</div>'+ask
    : '<div class="phead">'+ask+affBar(n,n.criteria.length)+'</div>';
  var body=head+ctxHTML(n)+mediaHTML(n.media)+
    '<textarea id="ans" placeholder="'+esc(n.placeholder||'Write your answer. Two or three sentences is enough.')+'"></textarea>'+
    '<div class="rubwrap"><div class="rlab" id="rlab">'+n.criteria.length+' criteria - press e to show the rubric</div>'+
    '<div class="rubric'+(expand?'':' folded')+'" id="rub">'+n.criteria.map(function(c){
      return '<div class="crit"><span class="mk"></span><span>'+esc(c.label)+'</span></div>';}).join('')+redLineHTML(n)+'</div></div>'+
    '<div class="linkrow"><button class="primary" id="sub" style="margin-top:0">Submit for grading</button>'+
    (n.model?'<button class="linkbtn" id="modelBtn">Show me a model answer</button>':'')+'</div>'+
    '<div id="fb"></div>';
  stageOut({scene:n.scene,eyebrow:n.eyebrow,title:n.title},body);
  wireAff(n);
  if(expand){var eb=document.getElementById('eBtn');if(eb)eb.classList.add('on');}
  if(tries)document.getElementById('rlab').textContent=
    'Attempt '+(tries+1)+' - '+n.criteria.length+' criteria, press e to show the rubric';

  var mb=document.getElementById('modelBtn');
  if(mb)mb.addEventListener('click',function(){
    document.getElementById('ans').value=n.model;
    document.getElementById('fb').innerHTML='<div class="aibox fade"><div class="alab">Model answer loaded</div>'+
      '<div class="aifb">'+(n.modelExplain||'This covers every rubric criterion. Edit it or submit it as it stands to see the grade.')+'</div></div>';
    document.getElementById('ans').focus();
  });

  document.getElementById('sub').addEventListener('click',function(){
    var txt=document.getElementById('ans').value.trim();
    if(txt.length<12){document.getElementById('fb').innerHTML=
      '<div class="aibox fade"><div class="alab" style="color:var(--coral)">Write a reply first</div>'+
      '<div class="aifb">Give it a real answer, even one sentence, and it will be graded against the rubric.</div></div>';return;}
    S.tries[nodeId]=(S.tries[nodeId]||0)+1;
    document.getElementById('sub').disabled=true;
    document.getElementById('fb').innerHTML=
      '<div class="aibox fade"><div class="alab"><span class="spin"></span>Evaluating your answer</div></div>';
    var d=REDUCE?0:GRADE_DELAY;
    if(d)setTimeout(function(){revealGrade(n,nodeId,txt);},d);
    else revealGrade(n,nodeId,txt);
  });
}
function revealGrade(n,nodeId,txt){
  var res=evaluateAnswer(txt,n.criteria),total=n.criteria.length;
  var crits=stageEl.querySelectorAll('.crit');
  var anim=!REDUCE&&GRADE_DELAY>0;
  res.met.forEach(function(m,i){
    if(!m)return;
    if(!anim){crits[i].classList.add('met');return;}
    crits[i].style.opacity='.35';
    setTimeout(function(){crits[i].classList.add('met');crits[i].style.opacity='';},130*i+120);
  });
  var pass=res.score>=(n.pass||total);
  var tries=S.tries[nodeId];
  var canGo=pass||res.score>=total-1||tries>=2;
  if(typeof n.step==='number')S.chips[n.step]=res.score+'/'+total;
  document.getElementById('rlab').textContent=
    res.score+' of '+total+' criteria met - press e to see which';

  var fb;
  if(pass){fb=n.passNote||'Every criterion covered.';}
  else{
    var lead=res.score===total-1?'<b>Almost there.</b> ':'<b>Not yet.</b> ';
    fb=lead+(n.coachLead||'To make this land, ')+joinCoach(coachList(n,res.met))+'.';
  }
  var box=document.getElementById('fb').querySelector('.aibox');
  box.innerHTML='<div class="alab"><span class="scorepill'+(pass?' full':'')+'">'+res.score+' / '+total+'</span>'+
    'Rubric evaluation</div><div class="aifb">'+fb+'</div>'+
    '<div class="linkrow">'+
    (canGo?'<button class="primary" id="go" style="margin-top:0">'+(pass?'See how it lands':'Continue anyway')+'</button>':'')+
    (pass?'':'<button class="linkbtn" id="retry">Try again</button>')+'</div>';

  if(!S.log.some(function(l){return l.node===nodeId&&l.kind==='written';}))
    S.log.push({node:nodeId,kind:'written',pick:'written',score:res.score+'/'+total,
      missed:coachShort(n,res.met),answer:txt});
  else S.log.forEach(function(l){if(l.node===nodeId&&l.kind==='written'){
      l.score=res.score+'/'+total;l.missed=coachShort(n,res.met);l.answer=txt;l.tries=tries;}});

  var g=document.getElementById('go');
  if(g)g.addEventListener('click',function(){goTo(pass?(n.toPass||n.to):(n.toFail||n.to));});
  var r=document.getElementById('retry');
  if(r)r.addEventListener('click',function(){renderEvaluate(n,nodeId);});
}
function coachShort(n,met){
  return n.criteria.filter(function(c,i){return !met[i];}).map(function(c){return c.hint||c.label;});
}

/* ending */
function showEnding(key,e){
  S.ending=e;S.node=null;renderSteps();
  var rev=(e.revealed||[]).map(function(p){
    return '<li><span>'+esc(p[0])+'</span><span>'+esc(p[1])+'</span></li>';}).join('');
  stageOut(e,
    ctxHTML(e)+
    (e.moral?'<p class="moral">'+esc(e.moral)+'</p>':'')+
    blocksHTML(e,'top')+'<p class="stext">'+esc(e.verdict||'')+'</p>'+blocksHTML(e,'bottom')+
    (rev?'<ul class="revealed">'+rev+'</ul>':'')+
    mediaHTML(e.media)+
    '<div class="summary"><h3>Your session summary</h3>'+
    '<p>Copy this and drop it in the class channel. Your facilitator reads the decisions, not just the ending.</p>'+
    '<div class="code" id="code" style="white-space:pre-wrap">'+esc(sessionSummary(key,e))+'</div>'+
    '<button class="copy" id="cp">Copy summary</button></div>'+
    '<button class="ghost" id="again" style="margin-left:0">Run it again</button>',null,affBar(e,0));
  wireAff(e);
  document.getElementById('cp').addEventListener('click',function(){
    var t=document.getElementById('code').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(t);
    else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');document.body.removeChild(ta);}
    this.textContent='Copied';
  });
  document.getElementById('again').addEventListener('click',function(){start(S.sc);});
}
function list(a){
  if(!a||!a.length)return '';
  return a.length===1?a[0]:a.slice(0,-1).join(', ')+' and '+a[a.length-1];
}
function sessionSummary(endKey,e){
  var s=byId(S.sc),L=[];
  L.push(s.title+(s.kicker?' - '+s.kicker:''));
  if(anchorOf(s))L.push('Anchor: '+anchorOf(s)+(s.behaviour?' - '+s.behaviour:''));
  if(pillarOf(s))L.push('Pillar: '+pillarOf(s));
  var retries=S.log.filter(function(l){return l.gated;}).length;
  S.log.filter(function(l){return !l.gated;}).forEach(function(l){
    if(l.kind==='choice')L.push('Chose: '+l.label);
    if(l.kind==='multi')L.push('Gap check: '+l.score+' of the must-haves'+
      (l.missed&&l.missed.length?', missed '+list(l.missed):'')+
      (l.extras?' (and '+l.extras+' that did not matter)':''));
    if(l.kind==='written')L.push('Written answer: '+l.score+' rubric criteria'+
      (l.missed&&l.missed.length?', short on '+list(l.missed):' - full marks'));
  });
  if(retries)L.push('Corrected course after '+retries+' wrong turn'+(retries>1?'s':''));
  L.push('Ending: '+((e&&e.title)||endKey));
  var picks=S.log.map(function(l){return l.pick+(l.score?'('+l.score+')':'');}).join('>');
  L.push('PUP|'+s.id+'|'+(anchorOf(s)||'-')+'|'+picks+'|'+endKey);
  return L.join('\n');
}

/* ---------------------------- theme ---------------------------- */
(function(){
  var root=document.documentElement,saved=null;
  try{saved=localStorage.getItem('pup-theme');}catch(e){}
  if(saved==='light')root.setAttribute('data-theme','light');
  document.getElementById('themeBtn').addEventListener('click',function(){
    var light=root.getAttribute('data-theme')==='light';
    if(light)root.removeAttribute('data-theme');else root.setAttribute('data-theme','light');
    try{localStorage.setItem('pup-theme',light?'dark':'light');}catch(e){}
  });
})();

renderHub();
